<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 60" fill="none">
  <!-- ПЛЕЙСХОЛДЕР ЛОГОТИПА: восьмигранный "кристалл" — заменить на оригинальный файл логотипа заказчика при наличии -->
